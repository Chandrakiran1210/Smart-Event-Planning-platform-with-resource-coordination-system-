{% extends 'base.html' %}

{% block title %}Contact Admin{% endblock %}

{% block content %}

<div class="card" style="max-width: 700px; margin: 0 auto;">

    <h2>📩 Contact Admin</h2>

    <p style="color: #777; margin-bottom: 25px;">
        Send a message to the administrator if you need help.
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label>Subject</label>

            <input
                type="text"
                name="subject"
                placeholder="Enter subject"
                required
            >
        </div>

        <div class="form-group">
            <label>Message</label>

            <textarea
                name="message"
                rows="6"
                placeholder="Describe your issue or question..."
                required
            ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            📩 Send Message
        </button>

    </form>

</div>

{% endblock %}
