{% extends "base.html" %}

{% block content %}

<style>

/* =========================================================
   PAGE
   ========================================================= */

.qr-page {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}


/* =========================================================
   QR CARD
   ========================================================= */

.qr-card {
    background: white;
    border-radius: 20px;
    padding: 35px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
}


/* =========================================================
   TITLE
   ========================================================= */

.qr-title {
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 10px;
}

.qr-event-name {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 25px;
}


/* =========================================================
   QR IMAGE
   ========================================================= */

.qr-image-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 25px 0;
}

.qr-image {
    width: 350px;
    max-width: 100%;
    height: auto;
    border-radius: 10px;
}


/* =========================================================
   URL
   ========================================================= */

.qr-url {
    margin: 20px auto;
    padding: 15px;
    max-width: 650px;
    background: #f5f5f5;
    border-radius: 10px;
    word-break: break-all;
    font-size: 14px;
}


/* =========================================================
   REGISTER SCAN BUTTON
   ========================================================= */

.qr-register-text {
    display: inline-block;
    margin-top: 20px;
    color: #2563eb;
    font-size: 18px;
    font-weight: 600;
    text-decoration: none;
}

.qr-scan-btn {
    border: none;
    background: none;
    cursor: pointer;
    width: 100%;
    font-family: inherit;
    padding: 10px;
}

.qr-scan-btn:hover {
    color: #1d4ed8;
}


/* =========================================================
   DOWNLOAD BUTTON
   ========================================================= */

.qr-download-btn {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 24px;
    background: #2563eb;
    color: white;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
}

.qr-download-btn:hover {
    background: #1d4ed8;
}


/* =========================================================
   BACK BUTTON
   ========================================================= */

.qr-back-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 20px;
    background: #6b7280;
    color: white;
    border-radius: 10px;
    text-decoration: none;
}

.qr-back-btn:hover {
    background: #4b5563;
}


/* =========================================================
   SCANNER MODAL
   ========================================================= */

.qr-scanner-modal {
    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.75);

    z-index: 9999;

    justify-content: center;
    align-items: center;

    padding: 20px;

    box-sizing: border-box;
}


/* =========================================================
   SCANNER BOX
   ========================================================= */

.qr-scanner-box {
    width: 100%;
    max-width: 500px;

    background: white;

    border-radius: 20px;

    padding: 25px;

    text-align: center;

    box-sizing: border-box;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.30);
}


/* =========================================================
   SCANNER TITLE
   ========================================================= */

.qr-scanner-title {
    margin-top: 0;
    margin-bottom: 10px;

    font-size: 24px;
    font-weight: 700;
}


/* =========================================================
   SCANNER DESCRIPTION
   ========================================================= */

.qr-scanner-description {
    margin-bottom: 20px;

    color: #6b7280;

    font-size: 15px;
}


/* =========================================================
   QR READER
   ========================================================= */

#qr-reader {
    width: 100%;
    max-width: 450px;

    margin: 0 auto 20px auto;
}


/* =========================================================
   CLOSE BUTTON
   ========================================================= */

.qr-close-btn {
    border: none;

    background: #dc2626;

    color: white;

    padding: 12px 25px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 16px;

    font-weight: 600;
}

.qr-close-btn:hover {
    background: #b91c1c;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .qr-page {
        margin: 20px auto;
        padding: 10px;
    }

    .qr-card {
        padding: 20px;
    }

    .qr-title {
        font-size: 24px;
    }

    .qr-event-name {
        font-size: 19px;
    }

    .qr-image {
        width: 280px;
    }

    .qr-scanner-box {
        padding: 15px;
    }

    .qr-scanner-title {
        font-size: 21px;
    }

}

</style>


<div class="qr-page">

    <div class="qr-card">

        <!-- =================================================
             TITLE
        ================================================== -->

        <h1 class="qr-title">
            Event Registration QR
        </h1>


        <!-- =================================================
             EVENT NAME
        ================================================== -->

        <div class="qr-event-name">

            {{ event.name }}

        </div>


        <!-- =================================================
             QR CODE
        ================================================== -->

        <div class="qr-image-container">

            <img
                src="data:image/png;base64,{{ qr_code }}"
                alt="Event Registration QR Code"
                class="qr-image"
            >

        </div>


        <!-- =================================================
             QR URL
        ================================================== -->

        <div class="qr-url">

            {{ event_url }}

        </div>


        <!-- =================================================
             SCAN TO REGISTER
        ================================================== -->

        <button
            type="button"
            class="qr-register-text qr-scan-btn"
            onclick="openQRScanner()"
        >

            📷 Scan to Register

        </button>


        <!-- =================================================
             DOWNLOAD QR
        ================================================== -->

        <div>

            <a
                href="?download=1"
                class="qr-download-btn"
            >

                ⬇ Download QR

            </a>

        </div>


        <!-- =================================================
             BACK
        ================================================== -->

        <div>

            <a
                href="{% url 'event_list' %}"
                class="qr-back-btn"
            >

                ← Back to Events

            </a>

        </div>

    </div>

</div>


<!-- =========================================================
     QR SCANNER MODAL
========================================================= -->

<div
    id="qrScannerModal"
    class="qr-scanner-modal"
>

    <div class="qr-scanner-box">

        <h2 class="qr-scanner-title">

            📷 Scan Event QR

        </h2>


        <p class="qr-scanner-description">

            Point your camera at the event QR code.

        </p>


        <div id="qr-reader"></div>


        <button
            type="button"
            onclick="closeQRScanner()"
            class="qr-close-btn"
        >

            ✕ Close

        </button>

    </div>

</div>


<!-- =========================================================
     HTML5 QR CODE LIBRARY
========================================================= -->

<script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
</script>


<!-- =========================================================
     QR SCANNER JAVASCRIPT
========================================================= -->

<script>

let qrScanner = null;

let isScanning = false;


// =========================================================
// OPEN QR SCANNER
// =========================================================

function openQRScanner() {

    const modal =
        document.getElementById(
            "qrScannerModal"
        );


    modal.style.display = "flex";


    // Prevent multiple scanner instances
    if (isScanning) {

        return;

    }


    isScanning = true;


    qrScanner =
        new Html5Qrcode(
            "qr-reader"
        );


    qrScanner.start(

        {
            facingMode: "environment"
        },

        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },


        // =================================================
        // QR SUCCESS
        // =================================================

        function(decodedText) {

            console.log(
                "QR Scanned:",
                decodedText
            );


            // Stop camera
            if (qrScanner) {

                qrScanner.stop()

                    .then(function() {

                        qrScanner.clear();

                        qrScanner = null;

                        isScanning = false;


                        // =================================================
                        // OPEN URL INSIDE QR CODE
                        // =================================================

                        window.location.href =
                            decodedText;

                    })

                    .catch(function(error) {

                        console.error(
                            "Scanner stop error:",
                            error
                        );


                        qrScanner = null;

                        isScanning = false;


                        // Open scanned URL
                        window.location.href =
                            decodedText;

                    });

            }

            else {

                isScanning = false;

                window.location.href =
                    decodedText;

            }

        },


        // =================================================
        // SCANNING ERROR
        // =================================================

        function(errorMessage) {

            /*
             * This function is called continuously while
             * the camera is searching for a QR code.
             *
             * Temporary errors are ignored.
             */

        }

    )

    .catch(function(error) {

        console.error(
            "Camera Error:",
            error
        );


        isScanning = false;


        alert(
            "Unable to access camera. Please allow camera permission and try again."
        );


        closeQRScanner();

    });

}


// =========================================================
// CLOSE QR SCANNER
// =========================================================

function closeQRScanner() {

    const modal =
        document.getElementById(
            "qrScannerModal"
        );


    if (qrScanner) {

        qrScanner.stop()

            .then(function() {

                qrScanner.clear();

                qrScanner = null;

                isScanning = false;

                modal.style.display = "none";

            })

            .catch(function(error) {

                console.error(
                    "Scanner close error:",
                    error
                );


                qrScanner = null;

                isScanning = false;

                modal.style.display = "none";

            });

    }

    else {

        isScanning = false;

        modal.style.display = "none";

    }

}

</script>

{% endblock %}
