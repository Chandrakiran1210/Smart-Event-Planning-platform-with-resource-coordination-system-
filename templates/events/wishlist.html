{% extends 'base.html' %}{% block content %}<h1>My wishlist</h1>{% for event in events %}<div class="event"><h2>{{ event.name }}</h2><p>{{ event.category }} · {{ event.start_date }} · {{ event.organizer }}</p><div class="actions"><a class="btn" href="{% url 'event_detail' event.pk %}">Details</a><form method="post" action="{% url 'remove_from_wishlist' event.pk %}">{% csrf_token %}<button class="btn danger">Remove</button></form></div></div>{% empty %}<div class="card">Your wishlist is empty. <a href="{% url 'available_events' %}">Find events</a>.</div>{% endfor %}{% endblock %}
