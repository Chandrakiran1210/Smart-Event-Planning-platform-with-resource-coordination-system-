{% extends 'base.html' %}{% block content %}<div class="card"><h1>Review event</h1><h2>{{ event.name }}</h2><p>{{ event.description }}</p><p><b>Organizer:</b> {{ event.organizer }} · <b>Category:</b> {{ event.category }}</p><form method="post">{% csrf_token %}<label>Review note (shown to organizer)</label><textarea name="review_note">{{ event.review_note }}</textarea><button class="btn success" name="decision" value="APPROVED">Approve</button><button class="btn danger" name="decision" value="REJECTED">Reject</button></form></div>{% endblock %}
