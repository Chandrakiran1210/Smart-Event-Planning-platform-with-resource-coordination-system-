{% extends 'base.html' %}

{% block title %}
Theme
{% endblock %}

{% block content %}

<h1>🎨 Theme</h1>

<div class="card">

    <!-- =====================================================
         SELECT PAGE
    ====================================================== -->

    <h2>📄 Select Page</h2>

    <form method="POST" action="{% url 'theme_settings' %}">

        {% csrf_token %}

        <div class="theme-page-grid">

            <label>
                <input type="radio" name="page_name" value="dashboard" checked>
                📊 Dashboard
            </label>

            <label>
                <input type="radio" name="page_name" value="events">
                📅 Events
            </label>

            <label>
                <input type="radio" name="page_name" value="available_events">
                📅 Available Events
            </label>

            <label>
                <input type="radio" name="page_name" value="joined_events">
                🎟️ Joined Events
            </label>

            <label>
                <input type="radio" name="page_name" value="wishlist">
                ❤️ Wishlist
            </label>

            <label>
                <input type="radio" name="page_name" value="calendar">
                🗓️ Calendar
            </label>

            <label>
                <input type="radio" name="page_name" value="profile">
                👤 Profile
            </label>

            <label>
                <input type="radio" name="page_name" value="settings">
                ⚙️ Settings
            </label>

            <label>
                <input type="radio" name="page_name" value="categories">
                📁 Categories
            </label>

            <label>
                <input type="radio" name="page_name" value="venues">
                🏢 Venues
            </label>

            <label>
                <input type="radio" name="page_name" value="resources">
                🛠️ Resources
            </label>

            <label>
                <input type="radio" name="page_name" value="admin_dashboard">
                🛡️ Admin Dashboard
            </label>

        </div>


        <!-- =====================================================
             SIDEBAR COLOR
        ====================================================== -->

        <div class="theme-setting-card">

            <h2>🟦 Sidebar Color</h2>

            <div class="theme-color-area">

                <label for="sidebar_color">
                    Select Sidebar Color
                </label>

                <input
                    type="color"
                    id="sidebar_color"
                    name="sidebar_color"
                    value="#111827"
                >

                <span id="sidebar_color_code">
                    #111827
                </span>

            </div>

        </div>


        <!-- =====================================================
             TOPBAR COLOR
        ====================================================== -->

        <div class="theme-setting-card">

            <h2>🟪 Topbar Color</h2>

            <div class="theme-color-area">

                <label for="topbar_color">
                    Select Topbar Color
                </label>

                <input
                    type="color"
                    id="topbar_color"
                    name="topbar_color"
                    value="#ffffff"
                >

                <span id="topbar_color_code">
                    #ffffff
                </span>

            </div>

        </div>


        <!-- =====================================================
             FONT STYLE
        ====================================================== -->

        <div class="theme-setting-card">

            <h2>🔤 Font Style</h2>

            <div class="font-style-grid">

                <label class="font-option">

                    <input
                        type="radio"
                        name="font_style"
                        value="Arial"
                        checked
                    >

                    <span style="font-family: Arial, sans-serif;">
                        Arial
                    </span>

                </label>


                <label class="font-option">

                    <input
                        type="radio"
                        name="font_style"
                        value="Segoe UI"
                    >

                    <span style="font-family: 'Segoe UI', sans-serif;">
                        Segoe UI
                    </span>

                </label>


                <label class="font-option">

                    <input
                        type="radio"
                        name="font_style"
                        value="Roboto"
                    >

                    <span style="font-family: Roboto, sans-serif;">
                        Roboto
                    </span>

                </label>


                <label class="font-option">

                    <input
                        type="radio"
                        name="font_style"
                        value="Georgia"
                    >

                    <span style="font-family: Georgia, serif;">
                        Georgia
                    </span>

                </label>


                <label class="font-option">

                    <input
                        type="radio"
                        name="font_style"
                        value="Verdana"
                    >

                    <span style="font-family: Verdana, sans-serif;">
                        Verdana
                    </span>

                </label>

            </div>

        </div>


        <!-- =====================================================
             COLOR PRESETS
        ====================================================== -->

        <div class="theme-setting-card">

            <h2>🎨 Color Presets</h2>

            <div class="theme-presets">

                <button
                    type="button"
                    data-color="#2563eb"
                    style="background:#2563eb;"
                    aria-label="Blue"
                >
                </button>

                <button
                    type="button"
                    data-color="#7c3aed"
                    style="background:#7c3aed;"
                    aria-label="Purple"
                >
                </button>

                <button
                    type="button"
                    data-color="#16a34a"
                    style="background:#16a34a;"
                    aria-label="Green"
                >
                </button>

                <button
                    type="button"
                    data-color="#f59e0b"
                    style="background:#f59e0b;"
                    aria-label="Orange"
                >
                </button>

                <button
                    type="button"
                    data-color="#dc2626"
                    style="background:#dc2626;"
                    aria-label="Red"
                >
                </button>

                <button
                    type="button"
                    data-color="#ec4899"
                    style="background:#ec4899;"
                    aria-label="Pink"
                >
                </button>

                <button
                    type="button"
                    data-color="#0891b2"
                    style="background:#0891b2;"
                    aria-label="Cyan"
                >
                </button>

                <button
                    type="button"
                    data-color="#111827"
                    style="background:#111827;"
                    aria-label="Dark"
                >
                </button>

            </div>

        </div>


        <!-- =====================================================
             BUTTONS
        ====================================================== -->

        <div class="actions">

            <a
                href="{% url 'admin_dashboard' %}"
                class="btn secondary"
            >
                ← Back
            </a>

            <button
                type="submit"
                class="btn primary"
            >
                💾 Save Theme
            </button>

        </div>

    </form>

</div>


<!-- =========================================================
     THEME PAGE CSS
========================================================= -->

<style>

/* =========================================================
   THEME PAGE GRID
========================================================= */

.theme-page-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
}

.theme-page-grid label {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 46px;
    padding: 10px 13px;

    border: 1px solid var(--border);
    border-radius: 8px;

    background: var(--card-bg);
    color: var(--text);

    font-size: 13px;
    font-weight: 600;

    cursor: pointer;
    transition: var(--transition);
}

.theme-page-grid label:hover {
    border-color: var(--primary);
    background: var(--primary-light);
}

.theme-page-grid input[type="radio"] {
    margin: 0;
    accent-color: var(--primary);
}

.theme-page-grid label:has(input[type="radio"]:checked) {
    border-color: var(--primary);
    background: var(--primary-light);
}


/* =========================================================
   THEME SETTING CARD
========================================================= */

.theme-setting-card {
    width: 100%;

    background: var(--card-bg);

    border: 1px solid var(--border);
    border-radius: 9px;

    padding: 16px;

    margin-bottom: 14px;
}

.theme-setting-card h2 {
    margin: 0 0 14px 0;

    font-size: 15px;
    font-weight: 700;

    color: var(--text);
}


/* =========================================================
   COLOR SETTINGS
========================================================= */

.theme-color-area {
    display: grid;

    grid-template-columns: 180px 1fr 90px;

    align-items: center;

    gap: 12px;

    width: 100%;
}

.theme-color-area label {
    margin: 0;

    color: var(--text);

    font-size: 12px;
    font-weight: 600;
}

.theme-color-area input[type="color"] {
    width: 100%;
    height: 38px;

    padding: 3px;

    border: 1px solid var(--border);
    border-radius: 7px;

    background: var(--card-bg);

    cursor: pointer;
}

.theme-color-area span {
    padding: 7px 9px;

    border: 1px solid var(--border);
    border-radius: 6px;

    background: var(--page-bg);

    color: var(--text);

    font-family: monospace;
    font-size: 11px;

    text-align: center;
}


/* =========================================================
   FONT STYLE
========================================================= */

.font-style-grid {
    display: grid;

    grid-template-columns: repeat(5, 1fr);

    gap: 12px;

    width: 100%;
}

.font-option {
    display: flex;

    align-items: center;

    gap: 8px;

    min-height: 48px;

    padding: 10px 12px;

    border: 1px solid var(--border);
    border-radius: 8px;

    background: var(--card-bg);

    color: var(--text);

    cursor: pointer;

    transition: var(--transition);
}

.font-option:hover {
    border-color: var(--primary);
    background: var(--primary-light);
}

.font-option:has(input[type="radio"]:checked) {
    border-color: var(--primary);
    background: var(--primary-light);
}

.font-option input[type="radio"] {
    margin: 0;

    flex-shrink: 0;

    accent-color: var(--primary);
}

.font-option span {
    font-size: 14px;
    font-weight: 600;
}


/* =========================================================
   COLOR PRESETS
========================================================= */

.theme-presets {
    display: flex;

    align-items: center;

    gap: 12px;

    flex-wrap: wrap;
}

.theme-presets button {
    width: 34px;
    height: 34px;

    padding: 0;

    border: 2px solid var(--card-bg);

    outline: 1px solid var(--border);

    border-radius: 50%;

    cursor: pointer;

    transition: var(--transition);
}

.theme-presets button:hover {
    transform: scale(1.08);

    outline-color: var(--primary);
}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.actions {
    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 10px;

    margin-top: 18px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .theme-page-grid {
        grid-template-columns: 1fr 1fr;
    }

    .font-style-grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .theme-color-area {
        grid-template-columns: 160px 1fr 85px;
    }

}


@media (max-width: 600px) {

    .theme-page-grid {
        grid-template-columns: 1fr;
    }

    .font-style-grid {
        grid-template-columns: 1fr;
    }

    .theme-color-area {
        grid-template-columns: 1fr;
        gap: 8px;
    }

    .theme-color-area input[type="color"] {
        height: 42px;
    }

    .theme-color-area span {
        text-align: left;
        width: fit-content;
    }

    .actions {
        justify-content: flex-start;
        flex-wrap: wrap;
    }

}

</style>

{% endblock %}
